# 自动构建并发布 Stash 定制版 Docker 镜像
#
# 触发条件：
#   - 推送到 custom-ui 分支   -> latest / custom-ui / edge / sha-xxxxxxx
#   - 推送 v* 标签            -> 1.2.3 / 1.2 / latest
#   - Actions 页面手动触发    -> 可选一个自定义标签（手动触发请选择 custom-ui 分支）
#
# 产物：ghcr.io/lemon-o/stash，同时提供 linux/amd64 与 linux/arm64。
#
# 实现方式：两个架构各自在原生运行器上构建（amd64 用 x86 运行器，arm64 用 ARM 运行器），
# 各自按 digest 推送，最后由 publish 作业合并成一个多架构清单。
# 这样避免了 QEMU 模拟构建，速度快很多。
#
# 构建文件是 docker/build/custom/Dockerfile —— 它基于上游的
# docker/build/x86_64/Dockerfile，只把 pnpm 固定成 packageManager 指定的版本，
# 否则在 Alpine 上会因缺少 @pnpm/exe 的 musl 原生二进制而失败，详见该文件头部注释。
# "x86_64" 只是上游的历史目录名，其中的 node/golang/alpine 基础镜像都是多架构通用的。

name: Docker Image

on:
  push:
    branches:
      - custom-ui
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "额外的镜像标签（可留空，例如 test）"
        required: false
        type: string

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # 1) 计算版本号与镜像标签
  # ---------------------------------------------------------------------------
  prepare:
    name: 准备版本信息与标签
    runs-on: ubuntu-24.04
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.meta.outputs.version }}
      githash: ${{ steps.version.outputs.githash }}
      stash_version: ${{ steps.version.outputs.stash_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # 需要完整历史与标签，才能算出 git describe 版本号
          fetch-depth: 0
          fetch-tags: true

      - name: 计算 GITHASH 与 STASH_VERSION
        id: version
        run: |
          set -euo pipefail
          GITHASH="$(git rev-parse --short HEAD)"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            STASH_VERSION="${GITHUB_REF_NAME}"
          else
            # 与 Makefile 的默认行为保持一致
            STASH_VERSION="$(git describe --tags --always --exclude latest_develop 2>/dev/null || echo "${GITHASH}")"
          fi
          {
            echo "githash=${GITHASH}"
            echo "stash_version=${STASH_VERSION}"
          } >> "${GITHUB_OUTPUT}"
          echo "GITHASH=${GITHASH}"
          echo "STASH_VERSION=${STASH_VERSION}"

      - name: 生成镜像元数据与标签
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/custom-ui' || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=custom-ui,enable=${{ github.ref == 'refs/heads/custom-ui' }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/custom-ui' }}
            type=raw,value=${{ inputs.tag || 'manual' }},enable=${{ inputs.tag != '' }}
            type=sha,format=short,prefix=sha-

  # ---------------------------------------------------------------------------
  # 2) 每个架构各自构建并按 digest 推送
  # ---------------------------------------------------------------------------
  build:
    name: 构建 ${{ matrix.platform }}
    needs: prepare
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            optional: false
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            optional: true
    runs-on: ${{ matrix.runner }}
    # arm64 运行器若不可用（例如仓库转为私有），不拖垮整条流水线，
    # 仍然会发布 amd64 镜像；日志里会有告警。
    continue-on-error: ${{ matrix.optional }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: 释放运行器磁盘空间
        # 这个 Dockerfile 会在容器内安装前端依赖并编译整个 Go 项目，磁盘占用较大。
        # 先删掉与本工作流无关的预装 SDK，避免 "no space left on device"；失败也不影响构建。
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送（按 digest）
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/build/custom/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            GITHASH=${{ needs.prepare.outputs.githash }}
            STASH_VERSION=${{ needs.prepare.outputs.stash_version }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          # 这个 Dockerfile 的耗时都在中间层（前端依赖 + Go 编译），所以必须 mode=max
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max,ignore-error=true
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: 导出 digest
        run: |
          set -eo pipefail
          digest="${{ steps.build.outputs.digest }}"
          if [ -z "${digest}" ]; then
            echo "::error::构建没有返回镜像 digest。"
            exit 1
          fi
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"
          echo "digest: ${digest}"

      - name: 上传 digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 3) 合并成一个多架构清单并打上正式标签
  # ---------------------------------------------------------------------------
  publish:
    name: 发布多架构镜像清单
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - name: 下载所有 digest
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 合并并推送多架构清单
        working-directory: /tmp/digests
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -eo pipefail

          tag_args=()
          sources=()

          while IFS= read -r ref; do
            if [ -n "$ref" ]; then
              tag_args+=(-t "$ref")
            fi
          done <<< "${TAGS}"

          for f in *; do
            if [ -f "$f" ]; then
              sources+=("${IMAGE}@sha256:${f}")
            fi
          done

          if [ ${#sources[@]} -eq 0 ]; then
            echo "::error::没有收集到任何镜像 digest，无法发布。"
            exit 1
          fi
          if [ ${#tag_args[@]} -eq 0 ]; then
            echo "::error::没有可用的镜像标签，请检查 metadata 配置。"
            exit 1
          fi

          echo "包含 ${#sources[@]} 个架构："
          printf '  %s\n' "${sources[@]}"
          echo "发布标签："
          printf '%s\n' "${TAGS}" | sed 's/^/  /'
          echo

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

      - name: 校验发布结果
        env:
          PRIMARY: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}
        run: |
          set -eo pipefail
          echo "检查 ${PRIMARY}"
          docker buildx imagetools inspect "${PRIMARY}"

      - name: 写入任务摘要
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          {
            echo "## Docker 镜像已发布"
            echo ""
            echo "**版本**：\`${{ needs.prepare.outputs.stash_version }}\`（\`${{ needs.prepare.outputs.githash }}\`）"
            echo ""
            echo "**可用标签**"
            echo ""
            echo '```'
            printf '%s\n' "${TAGS}"
            echo '```'
            echo ""
            echo "**客户端拉取**"
            echo ""
            echo '```bash'
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            echo '```'
            echo ""
            echo "首次发布后，需要在仓库的 Packages 页面把该镜像的可见性改为 Public，客户端才能免登录拉取。"
          } >> "${GITHUB_STEP_SUMMARY}"
